html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--panel); color: var(--ink); font-family: var(--sans); overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); gap: 8px; }
.bar { display: flex; align-items: center; gap: 8px; }

.wait { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }

.tiles { flex: 1; overflow-y: auto; display: grid; gap: 10px; align-content: start; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 2px 2px 6px; }

.t .n.d3 { font-size: clamp(36px, 11vw, 52px); letter-spacing: -.04em; }
.t .n.d4 { font-size: clamp(28px, 8.5vw, 40px); letter-spacing: -.04em; }
.coupes .t .n { font-size: clamp(52px, 17vw, 76px); }
.coupes .t .n.long { font-size: clamp(24px, 7.5vw, 34px); }
.t .s { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 700; padding: 6px 8px; text-align: left; background: rgba(0,0,0,.09); }
.t .s.blank { background: none; }

.t .s:last-child { border-radius: 0 0 14px 14px; }
.t .s.bee { background: var(--ink); color: var(--amber); font-weight: 800; }
.t .s.rp { background: var(--danger); color: var(--on-solid); }

.t.sfx .n { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
.t.done { background: var(--green); color: var(--on-solid); border-color: var(--green); }
.t.part { border-color: var(--green); }
.t.sug { outline: 4px solid var(--amber); outline-offset: 2px; }
.t .s.here-s { background: var(--amber); color: var(--on-amber); }
.here { border: 0; border-radius: 16px; background: var(--green); color: var(--on-solid); font: 600 20px var(--sans); padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.here b { font-weight: 800; font-size: 28px; }
.here span { font-size: 14px; opacity: .85; }
.here span.l1 { font-size: 20px; opacity: 1; }
.loc { font-size: 14px; color: var(--muted); padding: 2px 2px; }
.site { font-size: 18px; padding: 12px 14px; }
.ctitle { flex: 1; min-width: 0; font: 800 28px var(--sans); }
.cnt { font: 700 16px var(--sans); color: var(--muted); }

.foot span { flex: 1; }

.panel .prow { display: flex; align-items: center; gap: 12px; }
.panel .lab { font: 700 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.panel .qrow button { border: 0; background: var(--amber); color: var(--on-amber); font: 800 18px var(--sans); border-radius: 10px; padding: 8px 12px; min-width: 48px; }
.panel .letter { display: flex; flex-direction: column; align-items: center; min-width: 52px; }
.panel .letter b { font: 800 40px/1 var(--sans); color: var(--ink); }

.panel .stat b { font: 800 20px var(--sans); color: var(--ink); }

.head { display: flex; align-items: center; gap: 8px; }

.row b { color: var(--green); font-weight: 800; }

function storedBoxes() {
  try { const d = JSON.parse(localStorage.getItem(BOXES_KEY) || "null"); return d && d.boxes && Object.keys(d.boxes).length ? d : null; }
  catch (e) { return null; }

function storeBoxes(boxes, example, label) {

  useBoxes();
}
function parseList(text) {
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return null;
  const cells = l => l.split(/[,\t;]/).map(c => c.trim().replace(/^"|"$/g, ""));
  let bi = 0, ci = 1, from = 0;
  const h = cells(lines[0]).map(c => c.toLowerCase());
  if (h.includes("box") || h.includes("coupe")) { bi = h.indexOf("box"); ci = h.indexOf("coupe"); from = 1; if (bi < 0 || ci < 0) return null; }
  const out = {};
  for (const l of lines.slice(from)) {
    const c = cells(l), b = c[bi], k = c[ci];
    if (!b || !k) continue;
    out[k] = out[k] || [];
    if (!out[k].includes(b)) out[k].push(b);
  }
  return Object.keys(out).length ? out : null;
}

// A short tick so you know a box saved without looking: high for a result, low for Queue,
// two for a finished coupe. iPhones go quiet when the silent switch is on.
let actx = null;
function tick(kind) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const beep = (at, freq) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + at;
      o.type = "square"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.07);
    };
    if (kind === "queue") beep(0, 520);
    else if (kind === "finish") { beep(0, 1320); beep(0.11, 1760); }
    else beep(0, 1320);
  } catch (e) { /* no sound is fine */ }
}
function setRec(label, rec, msg) {
  const before = S.rec[label];
  if (rec) { rec.time = now(); S.rec[label] = rec; tick(rec.state === "wait" ? "queue" : "save"); } else delete S.rec[label];
  if (!S.started) S.started = now();
  if (!S.date) S.date = today();
  S.exported = null;           // anything new means the last export is out of date
  grid();
  // No splash: going back into a box and answering again replaces the record.
}

function grid() {
  inCard = false; save(); stopLocating();
  const list = BOXES[S.coupe];
  if (!list) return coupes();
  const waiting = list.filter(l => S.rec[l] && S.rec[l].state === "wait");
  const done = list.filter(l => S.rec[l] && S.rec[l].state !== "wait").length;
  const repairs = list.filter(l => S.repair[l]).length;
  let h = `<div class="tiles">`;
  for (const l of list) {
    const r = S.rec[l], lt = LAST[l];
    const cls = (r ? (r.state === "wait" ? "hold" : "done") : "") + (S.repair[l] ? " fix" : "");
    const today = !r || r.state === "clear" ? "" : r.state === "wait" ? "Queued" : r.state === "dorm" ? `${r.mice.length} dorm` : SHORT[r.what] || r.what;
    const top = lt ? `<span class="s was${lt.bees ? " bee" : ""}">${esc(lt.tag)}</span>` : `<span class="s blank">&nbsp;</span>`;
    const bot = today ? `<span class="s now">${esc(today)}</span>` : `<span class="s blank">&nbsp;</span>`;
    h += `<button class="t ${cls}${/[a-e]$/.test(l) ? " sfx" : ""}" data-b="${esc(l)}" aria-label="Box ${esc(l)}">` +
      top + `<span class="n${short(l).length >= 4 ? " d4" : short(l).length === 3 ? " d3" : ""}">${esc(short(l))}</span>` + bot + `</button>`;
  }
  h += `</div>`;
  const left = list.length - done - waiting.length;
  const notes = [waiting.length ? `${waiting.length} queued` : "", repairs ? `${repairs} repair${repairs === 1 ? "" : "s"}` : "",
    left ? `${left} to do` : ""].filter(Boolean).join(" · ") || "all marked";
  h += `<div class="panel">` +
    (waiting.length ? `<div class="qrow"><span class="lab">Queue</span>` + waiting.map(l => `<button data-b="${esc(l)}">${esc(short(l))}</button>`).join("") + `</div>` : "") +
    `<div class="prow"><button class="btn" id="tocoupes">Back</button>` +
    `<div class="ident"><div><b${S.coupe.length > 2 ? ' class="long"' : ""}>${esc(S.coupe)}</b><span class="lab">Coupe</span></div><div><b>${done}/${list.length}</b><span class="lab">Done</span></div></div>` +
    `<button class="btn go" id="finish">Finish coupe</button></div></div>`;
  app.innerHTML = h;
  // Keep every strip on one line: step the text down until it fits, ellipsis as a last resort.
  const fit = s => { s.style.fontSize = ""; for (let f = 14; f > 11 && s.scrollWidth > s.clientWidth; f--) s.style.fontSize = (f - 1) + "px"; };
  const strips = [...app.querySelectorAll(".t .s")];
  strips.forEach(fit);
  app.querySelectorAll("[data-b]").forEach(b => b.onclick = () => {
    box = b.dataset.b; const r = S.rec[box];
    r && r.state === "wait" ? inside() : call();
  });
  document.getElementById("finish").onclick = () => finishCoupe(list, waiting);
  document.getElementById("tocoupes").onclick = coupes;
}

// Finish coupe. Boxes nobody marked get a reminder; with positive recording they count as empty.
function finishCoupe(list, waiting) {
  const unmarked = list.filter(l => !S.rec[l]);
  const close = () => { const sh = document.getElementById("sheet"); sh.hidden = true; sh.innerHTML = ""; };
  const done = msg => {
    S.finished[S.coupe] = true; S.exported = null; save(); close(); tick("finish"); coupes();
    toast(msg || `Coupe ${S.coupe} finished`);
  };
  if (!unmarked.length) return done(waiting.length ? `Coupe ${S.coupe} finished, ${waiting.length} still queued` : null);
  const sh = document.getElementById("sheet");
  sh.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <h2 id="sh-t">${unmarked.length} box${unmarked.length === 1 ? "" : "es"} not marked</h2>
    <button class="btn go" id="sh-empty">Mark ${unmarked.length} as empty, finish coupe</button>
    <button class="btn" id="sh-back">Go back</button></div>`;
  sh.hidden = false;
  document.getElementById("sh-back").onclick = close;
  document.getElementById("sh-empty").onclick = () => {
    const t = now();
    if (!S.started) S.started = t;
    if (!S.date) S.date = today();
    unmarked.forEach(l => { S.rec[l] = { state: "clear", bulk: true, time: t }; });
    done(`Coupe ${S.coupe} finished, ${unmarked.length} marked empty`);
  };
}

const REPAIRS = [["Lid", "var(--danger)"], ["Hinge or catch", "var(--ochre)"], ["Fixing or wire", "var(--slate)"],

const repLabel = v => v === true ? "Repair" : v;

// New day wipes the phone's copy, so it takes two taps, and says so if nothing was exported.
function armNewDay(btn) {
  let armed = false;
  btn.onclick = () => {
    if (!hasData() || armed) { wipe(); coupes(); toast("New day started"); return; }
    armed = true;
    btn.classList.add("warn");
    btn.textContent = S.exported ? "Tap again" : "Not exported! Tap again to delete";
    setTimeout(() => { armed = false; btn.classList.remove("warn"); btn.textContent = "New day"; }, 4000);
  };
}

  Status: { Torpid: "T", Active: "A", Dead: "D" },
  Breeding: { "Testes scrotal": "TS", Pregnant: "P", Lactating: "L", "Post-lactating": "PL", "Non-breeding": "NB", Unknown: "U" },
  Age: { Adult: "Adult", Juvenile: "Juv", "Eyes open": "EO", "Grey, eyes closed": "GEC", Pink: "Pink" }
};
const coupeOf = l => Object.keys(BOXES).find(k => BOXES[k].includes(l)) || "";
const order = l => { const k = coupeOf(l); return Object.keys(BOXES).indexOf(k) * 1000 + BOXES[k].indexOf(l); };

function rows(end) {
  const labels = [...new Set([...Object.keys(S.rec), ...Object.keys(S.repair).filter(l => S.repair[l])])].sort((a, b) => order(a) - order(b));
  const out = [];
  for (const l of labels) {
    const r = S.rec[l];
    const base = { site: S.site, check_date: S.date || today(), coupe: coupeOf(l), surveyors: S.surveyors.trim(),
      start_time: S.started || "", end_time: end, box_ref: l, box_time: r ? r.time : "",
      box_condition: S.repair[l] ? "repair: " + repLabel(S.repair[l]).toLowerCase() : "fine" };
    if (!r) out.push({ ...base, notes: "repair noted, box not recorded" });
    else if (r.state === "wait") out.push({ ...base, occupied: "queued", notes: "queued, not checked" });
    else if (r.state === "clear") out.push({ ...base, occupied: "no", dm_nest: 0, dm_count: 0,
      notes: r.bulk ? "not marked, recorded empty at finish (positive recording)" : "" });
    else if (r.state === "other") out.push({ ...base, occupied: "yes", contents: r.what, dm_nest: r.what === "Dormouse nest" ? 1 : 0, dm_count: 0 });
    else r.mice.forEach((m, i) => out.push({ ...base, occupied: "yes", contents: "Dormouse", dm_nest: 1, dm_count: r.mice.length,
      dormouse_no: i + 1, sex: CODE.Sex[m.Sex] || "", weight_g: (m.Weight || "").replace(" g", ""), status: CODE.Status[m.Status] || "",
      breeding: CODE.Breeding[m.Breeding] || "", age: CODE.Age[m.Age] || "" }));
  }
  return out;
}
function toCSV(rs) {
  const q = v => { v = v == null ? "" : String(v); return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  return [COLS.join(","), ...rs.map(r => COLS.map(c => q(r[c])).join(","))].join("\r\n") + "\r\n";
}

function exportView() {
  const end = now(), rs = rows(end), csv = toCSV(rs);
  const coupes = [...new Set(rs.map(r => r.coupe))].join("-") || S.coupe;
  const name = `${S.date || today()}_${S.site}_dormouse-boxes_${coupes}.csv`;
  const file = new File([csv], name, { type: "text/csv" });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  const done = how => { S.exported = `${now()} (${how})`; save(); summary(); toast("Exported. Keep the file safe until it's on the map"); };
  app.innerHTML = `<div class="head"><h1 style="font-size:26px">Export</h1><button class="btn" id="back">Back</button></div>
    <div class="sum">
      <div style="font-size:15px"><b>${rs.length}</b> rows · ${esc(name)}</div>
      ${S.surveyors.trim() ? "" : `<div class="done-note" style="color:var(--danger)">Who checked is blank. Go back and add it first.</div>`}
      <div class="prev"><table><tr>${COLS.map(c => `<th>${c}</th>`).join("")}</tr>${rs.slice(0, 30).map(r => `<tr>${COLS.map(c => `<td>${esc(r[c] ?? "")}</td>`).join("")}</tr>`).join("")}</table></div>
      <div style="color:var(--muted);font-size:13px">One row per box, or per dormouse, in NDMP sheet order. On a desk: ArcGIS Online → Box checks → Update data → Append.</div>
    </div>
    <div class="stack">
      ${canShare ? `<button class="btn go" style="padding:16px" id="share">Share file (OneDrive, email…)</button>` : ""}
      <div class="bar"><button class="btn${canShare ? "" : " go"}" style="flex:1" id="savefile">Save file</button><button class="btn" style="flex:1" id="copy">Copy CSV</button></div>
    </div>`;
  document.getElementById("back").onclick = summary;
  if (canShare) document.getElementById("share").onclick = async () => {
    try { await navigator.share({ files: [file], title: name }); done("shared"); }
    catch (e) { if (e.name !== "AbortError") toast("Couldn't open sharing here. Use Save file or Copy CSV"); }
  };
  document.getElementById("savefile").onclick = async () => {
    // Inside the Claude viewer, files go through its own save prompt; anywhere else, a plain download.
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename: name, data: csv }); done("saved"); }
      catch (e) { if (!e || e.code !== "declined") toast("Couldn't save here. Use Copy CSV"); }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    done("saved");
  };
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(csv); done("copied"); }
    catch (e) { toast("Copy blocked here. Use Save file"); }
  };
}

// ---- Start: carry on with today's check, or deal with an old one that was never exported. --
function start() {
  const d0 = load();
  if (d0 && d0.site) S.site = d0.site;
  useBoxes();
  const d = d0;
  if (d && (Object.keys(d.rec || {}).length || Object.values(d.repair || {}).some(Boolean))) {
    Object.assign(S, { site: d.site || S.site, coupe: BOXES[d.coupe] ? d.coupe : S.coupe, rec: d.rec || {}, repair: d.repair || {}, finished: d.finished || {}, started: d.started || null,
      date: d.date || null, surveyors: d.surveyors || "", exported: d.exported || null });
    if (S.date && S.date !== today()) {
      if (S.exported) { wipe(); coupes(); return; }
      const n = Object.keys(S.rec).length;
      app.innerHTML = `<div class="head"><h1 style="font-size:26px">Unexported check</h1></div>
        <div class="sum"><div style="font-size:18px;font-weight:600">${esc(nice(S.date))}: ${n} box${n === 1 ? "" : "es"} recorded, never exported.</div>
        <div style="color:var(--muted)">Export it before starting today, or it'll be lost.</div></div>
        <div class="stack"><button class="btn go" style="padding:16px" id="old">Export it now</button><button class="btn" id="newday">Start today instead</button></div>`;
      document.getElementById("old").onclick = summary;
      armNewDay(document.getElementById("newday"));
      return;
    }
    if (d.draft && d.draft.box) {
      box = d.draft.box; mice = d.draft.mice || [{}]; cur = Math.min(d.draft.cur || 0, mice.length - 1);
      card(); toast(`Picked up box ${short(box)} where you left off`); return;
    }
    coupes(); toast(`Carried on: ${Object.keys(S.rec).length} boxes already done`); return;
  }
  coupes();
}
start();
// Keep the screen on while the app is open (Safari 16.4+; in a Home Screen app from iOS 18.4).
// The phone lets go when the app is hidden, so ask again each time it comes back, and on a tap.
let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);
document.addEventListener("pointerdown", keepAwake);
keepAwake();
// Works with no signal once it's been opened: the page is cached on the phone.
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
